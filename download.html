<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>物件リスト ダウンロード</title>
<style>
body { font-family: 'Hiragino Sans', sans-serif; background: #f0f4f8; display: flex; align-items: center; justify-content: center; min-height: 100vh; margin: 0; }
.box { background: white; border-radius: 12px; padding: 40px; text-align: center; box-shadow: 0 4px 16px rgba(0,0,0,0.1); max-width: 500px; width: 90%; }
h1 { font-size: 18px; color: #1e293b; margin-bottom: 8px; }
p { font-size: 14px; color: #64748b; margin-bottom: 24px; }
.btn { display: inline-block; background: #2563eb; color: white; text-decoration: none; padding: 12px 32px; border-radius: 8px; font-size: 15px; font-weight: 700; cursor: pointer; border: none; font-family: inherit; }
.btn:hover { background: #1d4ed8; }
table { width: 100%; border-collapse: collapse; margin-top: 24px; font-size: 12px; text-align: left; }
th { background: #f1f5f9; padding: 8px; color: #475569; font-weight: 600; border-bottom: 2px solid #e2e8f0; }
td { padding: 8px; border-bottom: 1px solid #f1f5f9; color: #1e293b; }
tr:hover td { background: #f8fafc; }
.price { font-weight: 700; color: #dc2626; }
.yield { font-weight: 700; color: #16a34a; }
</style>
</head>
<body>
<div class="box">
  <h1>千葉県 築古戸建投資 物件リスト</h1>
  <p>2026年4月23日作成 ／ 候補物件 4件</p>
  <button class="btn" onclick="downloadCSV()">CSVをダウンロード</button>

  <table>
    <thead>
      <tr><th>No.</th><th>所在地</th><th>価格</th><th>利回り</th><th>間取り</th><th>駐車</th></tr>
    </thead>
    <tbody>
      <tr><td>1</td><td>市原市 金谷</td><td class="price">171万</td><td class="yield">35.08%</td><td>3DK 平屋</td><td>2台</td></tr>
      <tr><td>2</td><td>市原市 姉崎</td><td class="price">290万</td><td class="yield">22.75%</td><td>3DK 2F</td><td>1台</td></tr>
      <tr><td>3</td><td>茂原市 下永吉</td><td class="price">360万</td><td class="yield">14.00%</td><td>3LDK 2F</td><td>2台</td></tr>
      <tr><td>4</td><td>茂原市 高師</td><td class="price">400万</td><td class="yield">13.50%</td><td>3DK 平屋</td><td>要確認</td></tr>
    </tbody>
  </table>
</div>

<script>
function downloadCSV() {
  const csv = `﻿No.,ポータル,所在地,物件No.,価格（万円）,利回り（%）,年間賃料（万円）,月賃料（万円）,築年数,間取り,構造,土地面積（㎡）,建物面積（㎡）,建ぺい率,容積率,駐車場,駐車台数,最寄駅,駅距離,公共下水,公営水道,再建築可,現況,傾き,白アリ,物件URL
1,健美家,市原市金谷,4283103wpt,171,35.08,60,5,1968年1月築（58年）,3DK,木造平屋,205.91,67.36,60%,100%,確認済,2台,JR東金駅,約4.5km（車前提）,要現地確認,要現地確認,要現地確認,要現地確認,要現地確認,要現地確認,https://www.kenbiya.com/pp8/s/chiba/ichihara-shi/re_4283103wpt/
2,健美家,市原市姉崎,4425051niz,290,22.75,66,5.5,1974年9月築（52年）,3DK,木造2階建て,86,65.81,,,確認済,1台,JR内房線 姉ケ崎駅,徒歩18分,要現地確認,要現地確認,要現地確認,入居状況要確認,要現地確認,要現地確認,https://www.kenbiya.com/pp8/s/chiba/ichihara-shi/re_4425051niz/
3,健美家,茂原市下永吉,4284952dvv,360,14.00,50.4,4.2,1983年10月築（42年）,3LDK,木造2階建て,236.66,91.29,60%,200%,確認済,2台,JR外房線 茂原駅,2700m（徒歩34分）,要現地確認,要現地確認,要現地確認,入居状況要確認,要現地確認,要現地確認,https://www.kenbiya.com/pp8/s/chiba/mobara-shi/re_4284952dvv/
4,健美家,茂原市高師,4434813nmi,400,13.50,54,4.5,1968年7月築（58年）,3DK,木造平屋,165.28,64.43,60%,200%,要現地確認,,JR外房線 新茂原・茂原駅,徒歩21〜22分,要現地確認,要現地確認,要現地確認,空室（2026/4/16新着）,要現地確認,要現地確認,https://www.kenbiya.com/pp8/s/chiba/mobara-shi/re_4434813nmi/`;

  const blob = new Blob([csv], { type: 'text/csv;charset=utf-8;' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = '千葉県築古戸建_物件リスト.csv';
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
