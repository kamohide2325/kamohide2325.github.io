const tbody = document.querySelector('#tbl tbody');
data.forEach(row => {
  const tr = document.createElement('tr');
  const 判定 = row[11];
  if (判定 === '○') tr.className = 'ok';
  else if (判定 === '×') tr.className = 'ng';
  else tr.className = 'unknown';
  row.forEach((val, i) => {
    const td = document.createElement('td');
    td.textContent = val;
    if (i === 12) td.className = 'note';
    tr.appendChild(td);
  });
  tbody.appendChild(tr);
});

function downloadExcel() {
  const headers = ["商品名","JANコード","ASIN","仕入れ価格(箱)","入り数","仕入れ単価","Amazon価格(1個)","FBA手数料","紹介料(9%)","利益","利益率(%)","判定","備考"];
  const ws = XLSX.utils.aoa_to_sheet([headers, ...data]);
  ws['!cols'] = [32,18,14,16,8,12,16,10,10,10,10,6,40].map(w=>({wch:w}));
  const wb = XLSX.utils.book_new();
  XLSX.utils.book_append_sheet(wb, ws, "せどりリサーチ");
  XLSX.writeFile(wb, "武田コーポレーション_せどりリサーチ.xlsx");
}
