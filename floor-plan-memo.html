<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <title>間取り図メモ — 茂原 4DK 380万円</title>
  <style>
    @page { size: A4 portrait; margin: 8mm; }
    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Meiryo', 'Hiragino Kaku Gothic ProN', Arial, sans-serif;
      background: #ccc;
      display: flex;
      justify-content: center;
      padding: 20px;
      font-size: 12px;
    }

    .a4 {
      width: 210mm;
      background: #fff;
      padding: 8mm 9mm;
      box-shadow: 0 4px 20px rgba(0,0,0,.3);
    }

    /* ─── HEADER ─── */
    .hd {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      border-bottom: 3px double #333;
      padding-bottom: 5px;
      margin-bottom: 7px;
    }
    .hd-l h1 { font-size: 15px; }
    .hd-l .sub { font-size: 9px; color: #666; margin-top: 2px; line-height: 1.6; }
    .hd-r { font-size: 10px; line-height: 2; text-align: right; white-space: nowrap; }
    .hd-r input {
      border: none; border-bottom: 1px solid #aaa;
      outline: none; font-size: 10px;
      font-family: inherit; width: 100px;
    }

    /* ─── FLOOR PLANS ─── */
    .plans {
      display: flex;
      gap: 8px;
      margin-bottom: 7px;
    }
    .plan {
      flex: 1;
      border: 1.5px solid #555;
      border-radius: 2px;
      overflow: hidden;
    }
    .plan-title {
      background: #333;
      color: #fff;
      text-align: center;
      font-size: 11px;
      font-weight: bold;
      padding: 3px 0;
      letter-spacing: 3px;
    }
    .plan svg { display: block; width: 100%; }

    /* ─── ROOM MEMO ─── */
    .room-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 5px;
      margin-bottom: 6px;
    }
    .rm {
      border: 1px solid #bbb;
      border-radius: 2px;
      padding: 4px 5px;
    }
    .rm-hd {
      font-size: 9px;
      font-weight: bold;
      color: #555;
      border-bottom: 1px solid #e0e0e0;
      padding-bottom: 2px;
      margin-bottom: 3px;
    }
    .rm textarea {
      width: 100%;
      border: none;
      outline: none;
      resize: none;
      font-family: inherit;
      font-size: 11px;
      line-height: 1.55;
      background: transparent;
    }

    /* ─── GENERAL MEMO ─── */
    .notes {
      border: 1px solid #bbb;
      border-radius: 2px;
      padding: 4px 6px;
    }
    .notes-hd {
      font-size: 10px;
      font-weight: bold;
      color: #444;
      margin-bottom: 3px;
    }
    .nl {
      display: block;
      width: 100%;
      border: none;
      border-bottom: 1px solid #ddd;
      outline: none;
      font-family: inherit;
      font-size: 12px;
      padding: 3px 2px;
      background: transparent;
    }

    @media print {
      body { background: #fff; padding: 0; }
      .a4 { box-shadow: none; }
    }
  </style>
</head>
<body>
<div class="a4">

  <!-- ══ HEADER ══ -->
  <div class="hd">
    <div class="hd-l">
      <h1>売戸建住宅 &nbsp;茂原駅 1.9km &nbsp;／&nbsp; 4DK &nbsp;／&nbsp; 380万円</h1>
      <div class="sub">
        千葉県茂原市東郷1850-5　JR外房線 茂原　建物 73.52㎡　土地 116.84㎡　木造2階建　築1971年12月<br>
        設備: 温水洗浄便座・IHクッキングヒーター・システムキッチン・床下収納・エアコン2台以上・都市ガス
      </div>
    </div>
    <div class="hd-r">
      内見日&ensp;<input type="text" placeholder="　年　月　日"><br>
      担当者&ensp;<input type="text" placeholder=""><br>
      同行者&ensp;<input type="text" placeholder="">
    </div>
  </div>

  <!-- ══ FLOOR PLANS ══ -->
  <div class="plans">

    <!-- ── 2F ── -->
    <div class="plan">
      <div class="plan-title">2 階</div>
      <svg viewBox="0 0 310 190" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hc" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="5" stroke="#bbb" stroke-width="1"/>
          </pattern>
        </defs>

        <!-- 外壁 -->
        <rect x="3" y="3" width="304" height="152" fill="white" stroke="#222" stroke-width="3.5"/>

        <!-- 間仕切り縦線 -->
        <line x1="158" y1="3" x2="158" y2="155" stroke="#333" stroke-width="2"/>
        <line x1="238" y1="3" x2="238" y2="155" stroke="#333" stroke-width="2"/>

        <!-- 物入 左上 -->
        <rect x="3" y="3" width="52" height="55" fill="url(#hc)" stroke="#444" stroke-width="1.5"/>
        <text x="29" y="22" text-anchor="middle" font-size="8" fill="#555">物入</text>

        <!-- 物入 右上 -->
        <rect x="258" y="3" width="49" height="55" fill="url(#hc)" stroke="#444" stroke-width="1.5"/>
        <text x="282" y="22" text-anchor="middle" font-size="8" fill="#555">物入</text>

        <!-- 洋室 6帖 -->
        <text x="80" y="90" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">洋室</text>
        <text x="80" y="110" text-anchor="middle" font-size="12" fill="#444">6帖</text>

        <!-- 洋室 3帖 -->
        <text x="198" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">洋室</text>
        <text x="198" y="108" text-anchor="middle" font-size="11" fill="#444">3帖</text>

        <!-- 洋室 6.8帖 -->
        <text x="274" y="90" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">洋室</text>
        <text x="274" y="108" text-anchor="middle" font-size="11" fill="#444">6.8帖</text>

        <!-- バルコニー1（点線） -->
        <rect x="3" y="155" width="235" height="30" fill="#f7f7f7" stroke="#999" stroke-width="1" stroke-dasharray="5,3"/>
        <text x="120" y="173" text-anchor="middle" font-size="9" fill="#777">バルコニー</text>

        <!-- バルコニー2（点線） -->
        <rect x="238" y="155" width="69" height="30" fill="#f7f7f7" stroke="#999" stroke-width="1" stroke-dasharray="5,3"/>
        <text x="272" y="173" text-anchor="middle" font-size="8" fill="#777">バルコニー</text>

        <!-- 方角ラベル -->
        <text x="155" y="188" text-anchor="middle" font-size="8" fill="#999">▲ 北　　　　南 ▼</text>
      </svg>
    </div>

    <!-- ── 1F ── -->
    <div class="plan">
      <div class="plan-title">1 階</div>
      <svg viewBox="0 0 310 215" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <pattern id="hc2" width="5" height="5" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
            <line x1="0" y1="0" x2="0" y2="5" stroke="#bbb" stroke-width="1"/>
          </pattern>
        </defs>

        <!-- 外壁 -->
        <rect x="3" y="3" width="304" height="208" fill="white" stroke="#222" stroke-width="3.5"/>

        <!-- 縦仕切り: 左列 | 中央 -->
        <line x1="65" y1="3" x2="65" y2="211" stroke="#333" stroke-width="2"/>
        <!-- 縦仕切り: 中央 | DK -->
        <line x1="242" y1="3" x2="242" y2="211" stroke="#333" stroke-width="2"/>
        <!-- 横仕切り（左列）: 物入|トイレ -->
        <line x1="3" y1="53" x2="65" y2="53" stroke="#333" stroke-width="1.5"/>
        <!-- 横仕切り（左列）: トイレ|玄関 -->
        <line x1="3" y1="133" x2="65" y2="133" stroke="#333" stroke-width="1.5"/>
        <!-- 横仕切り（中央上部）: 洗面|浴室の高さ違い対応 -->
        <line x1="65" y1="68" x2="148" y2="68" stroke="#333" stroke-width="1.5"/>
        <!-- 洗面と浴室の縦仕切り -->
        <line x1="148" y1="3" x2="148" y2="100" stroke="#333" stroke-width="1.5"/>
        <!-- 浴室下 / 押入上境界 -->
        <line x1="148" y1="100" x2="242" y2="100" stroke="#333" stroke-width="1.5"/>
        <!-- 押入下 / 和室上境界 -->
        <line x1="65" y1="133" x2="242" y2="133" stroke="#333" stroke-width="1.5"/>

        <!-- 物入 左上 -->
        <rect x="3" y="3" width="62" height="50" fill="url(#hc2)" stroke="#444" stroke-width="1"/>
        <text x="34" y="25" text-anchor="middle" font-size="8.5" fill="#555">物入</text>

        <!-- トイレ -->
        <rect x="3" y="53" width="62" height="80" fill="white" stroke="#444" stroke-width="1"/>
        <text x="34" y="96" text-anchor="middle" font-size="9.5" fill="#333">トイレ</text>

        <!-- 玄関 -->
        <rect x="3" y="133" width="62" height="78" fill="white" stroke="#444" stroke-width="1"/>
        <text x="34" y="175" text-anchor="middle" font-size="11" fill="#333">玄関</text>
        <!-- 上がり框 -->
        <line x1="3" y1="155" x2="65" y2="155" stroke="#555" stroke-width="1.5" stroke-dasharray="3,2"/>

        <!-- 洗面 -->
        <rect x="65" y="3" width="83" height="65" fill="white" stroke="#444" stroke-width="1"/>
        <text x="106" y="38" text-anchor="middle" font-size="10.5" fill="#333">洗面</text>

        <!-- 浴室 -->
        <rect x="148" y="3" width="94" height="97" fill="white" stroke="#444" stroke-width="1"/>
        <text x="195" y="55" text-anchor="middle" font-size="12" fill="#333">浴室</text>

        <!-- 押入 -->
        <rect x="65" y="68" width="83" height="65" fill="url(#hc2)" stroke="#444" stroke-width="1"/>
        <text x="106" y="103" text-anchor="middle" font-size="9" fill="#555">押入</text>

        <!-- 和室 6帖 -->
        <rect x="65" y="133" width="177" height="78" fill="white" stroke="#444" stroke-width="1"/>
        <text x="153" y="170" text-anchor="middle" font-size="16" font-weight="bold" fill="#222">和室</text>
        <text x="153" y="188" text-anchor="middle" font-size="12" fill="#444">6帖</text>

        <!-- DK 8.3帖 -->
        <text x="272" y="100" text-anchor="middle" font-size="14" font-weight="bold" fill="#222">DK</text>
        <text x="272" y="118" text-anchor="middle" font-size="11" fill="#444">8.3帖</text>

        <!-- 方角ラベル -->
        <text x="153" y="210" text-anchor="middle" font-size="8" fill="#999">▲ 北　　　　南 ▼</text>
      </svg>
    </div>

  </div><!-- /plans -->

  <!-- ══ ROOM MEMOS ══ -->
  <div class="room-grid">
    <div class="rm">
      <div class="rm-hd">📍 1F 和室 6帖</div>
      <textarea rows="3" placeholder="寸法・床・壁・窓・状態..."></textarea>
    </div>
    <div class="rm">
      <div class="rm-hd">📍 1F DK 8.3帖</div>
      <textarea rows="3" placeholder="キッチン・設備・収納・床..."></textarea>
    </div>
    <div class="rm">
      <div class="rm-hd">📍 1F 水回り（浴室・洗面・トイレ）</div>
      <textarea rows="3" placeholder="設備の状態・カビ・臭い..."></textarea>
    </div>
    <div class="rm">
      <div class="rm-hd">📍 2F 洋室 6帖</div>
      <textarea rows="3" placeholder="寸法・床・壁・窓・収納..."></textarea>
    </div>
    <div class="rm">
      <div class="rm-hd">📍 2F 洋室 3帖</div>
      <textarea rows="3" placeholder="寸法・用途・状態..."></textarea>
    </div>
    <div class="rm">
      <div class="rm-hd">📍 2F 洋室 6.8帖</div>
      <textarea rows="3" placeholder="寸法・床・壁・窓・収納..."></textarea>
    </div>
  </div>

  <!-- ══ GENERAL MEMO ══ -->
  <div class="notes">
    <div class="notes-hd">総合メモ・印象・チェックポイント・修繕箇所など</div>
    <input type="text" class="nl" placeholder="">
    <input type="text" class="nl">
    <input type="text" class="nl">
    <input type="text" class="nl">
    <input type="text" class="nl">
    <input type="text" class="nl">
    <input type="text" class="nl">
    <input type="text" class="nl">
  </div>

</div><!-- /a4 -->
</body>
</html>
